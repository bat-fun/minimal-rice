general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.92
    brightness = 0.35
}

input-field {
    monitor =
    size = 280, 52
    position = 0, -80
    halign = center
    valign = center

    outer_color = rgba(143, 32, 40, 0.85)
    inner_color = rgba(8, 9, 10, 0.82)
    font_color = rgb(d6d6d6)

    outline_thickness = 2
    rounding = 6

    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgb(e0e0e0)
    font_size = 64
    font_family = JetBrains Mono Nerd Font

    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(9b2029)
    font_size = 18
    font_family = JetBrains Mono Nerd Font

    position = 0, 55
    halign = center
    valign = center
}
