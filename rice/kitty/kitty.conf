# ╔══════════════════════════════════════╗
# ║          GOTHAM / KITTY             ║
# ╚══════════════════════════════════════╝

# ── Typography ──────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12

# Slightly tighter character spacing
modify_font cell_width 0
modify_font cell_height 0

# ── Window ──────────────────────────────

background #08090a
foreground #d8dee9

background_opacity 0.9

window_padding_width 14
window_padding_height 10

hide_window_decorations yes
remember_window_size no
initial_window_width 110
initial_window_height 32

# ── Cursor ──────────────────────────────

cursor #e05260
cursor_text_color #08090a
cursor_shape beam

cursor_blink_interval 0.7
cursor_stop_blinking_after 15.0

# ── Selection ───────────────────────────

selection_background #30343b
selection_foreground #ffffff

# ── Behavior ────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0
confirm_os_window_close 0

scrollback_lines 10000

copy_on_select no

# ── Links ───────────────────────────────

url_color #a33a42
url_style curly

# ── Gotham Night palette ─────────────────

color0  #0b0d10
color1  #e05260
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #abb2bf

color8  #4b5263
color9  #ff6b78
color10 #b5e890
color11 #ffd580
color12 #7dcfff
color13 #d78cff
color14 #6fe7f0
color15 #f8f8f2

# ── Tab bar ─────────────────────────────

tab_bar_edge top
tab_bar_style powerline
tab_fade 0.2

active_tab_foreground #eeeeee
active_tab_background #8f2028

inactive_tab_foreground #777777
inactive_tab_background #111214

# ── Rendering ───────────────────────────

sync_to_monitor yes

# ── Shell integration ───────────────────

shell_integration enabled
Shell /usr/bin/zsh